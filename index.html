          const [pinInput, setPinInput] = useState('');
          const [pinError, setPinError] = useState('');
          
          const [expenses, setExpenses] = useState([
            { id: 'ex1', title: 'JR 北海道 Airport 快速車票', amountJpy: 3980, amountTwd: 835, category: '交通', payer: 'Ginny', date: '2026-11-08' },

          const [expenseSubTab, setExpenseSubTab] = useState('list');

          const [newJournal, setNewJournal] = useState({ author: 'Ginny', text: '', photo: '' });

            { id: 't2', text: '預約藻岩山纜車/螃蟹會席大餐', category: '待辦', assignee: 'Ginny', done: true },
            { id: 't3', text: '準備兩雙防滑防水厚雪靴', category: '行李', assignee: 'everyone', done: false },
            { id: 't4', text: '購買零下低溫用手握式暖暖包', category: '行李', assignee: 'H', done: false },
            { id: 't5', text: '買 ROYCE 生巧克力與美瑛玉米麵包', category: '購物', assignee: 'Ginny', done: false }
          ]);

          // Countdown timer
          const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0 });
          useEffect(() => {
            const target = new Date('2026-11-08T06:15:00').getTime();
            const timer = setInterval(() => {
              const now = new Date().getTime();
              const diff = target - now;
              if (diff > 0) {
                setTimeLeft({
                  days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                  hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                  minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))
                });
              }
            }, 1000);
            return () => clearInterval(timer);
          }, []);

          const totalJpy = useMemo(() => expenses.reduce((acc, curr) => acc + (Number(curr.amountJpy) || 0), 0), [expenses]);
          const totalTwd = useMemo(() => Math.round(totalJpy * 0.21), [totalJpy]);

          const categoryTotals = useMemo(() => {
            const map = {};
            expenses.forEach(exp => {
              const cat = exp.category || '其他';
              if (!map[cat]) map[cat] = { jpy: 0, twd: 0 };
              map[cat].jpy += Number(exp.amountJpy) || 0;
              map[cat].twd += Number(exp.amountTwd) || Math.round((Number(exp.amountJpy) || 0) * 0.21);
            });
            return map;
          }, [expenses]);

          const handleUnlockPin = (e) => {
            e.preventDefault();
            if (pinInput === '2026') {
              setPinUnlocked(true);
              setPinError('');
            } else {
              setPinError('PIN 碼錯誤！(提示: YEAR)');
            }
          };

          const handleAddExpense = (e) => {
            e.preventDefault();
            if (!newExpense.title || !newExpense.amount) return;
            let jpy = 0, twd = 0;
            const val = Number(newExpense.amount);
            if (newExpense.currency === 'JPY') {
              jpy = val; twd = Math.round(jpy * 0.21);
            } else {
              twd = val; jpy = Math.round(twd / 0.21);
            }
            const item = {
              id: 'ex_' + Date.now(),
              title: newExpense.title,
              amountJpy: jpy,
              amountTwd: twd,
              category: newExpense.category,
              payer: newExpense.payer,
              date: ITINERARY_DATA.find(d => d.day === selectedDay)?.date || '2026-11-08'
            };
            setExpenses(prev => [...prev, item]);
            setShowAddExpense(false);
            setNewExpense({ title: '', amount: '', currency: 'JPY', category: '美食', payer: 'Ginny' });
          };

          const handleDeleteExpense = (id) => {
            setExpenses(prev => prev.filter(e => e.id !== id));
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
              setNewJournal(prev => ({ ...prev, photo: reader.result }));
            };
            reader.readAsDataURL(file);
          };

          const handleAddJournal = (e) => {
            e.preventDefault();
            if (!newJournal.text) return;
            const item = {
              id: 'j_' + Date.now(),
              author: newJournal.author,
              text: newJournal.text,
              photo: newJournal.photo || 'https://images.unsplash.com/photo-1542051841857-5f90071e7989?q=80&w=600&auto=format&fit=crop',
              date: new Date().toISOString().split('T')[0]
            };
            setJournals(prev => [item, ...prev]);
            setShowAddJournal(false);
            setNewJournal({ author: 'Ginny', text: '', photo: '' });
          };

          const handleAddTodo = (e) => {
            e.preventDefault();
            if (!newTodoText.trim()) return;
            const item = {
              id: 't_' + Date.now(),
              text: newTodoText,
              category: '待辦',
              assignee: newTodoAssignee,
              done: false
            };
            setTodos(prev => [...prev, item]);
            setNewTodoText('');
          };

          const handleToggleTodo = (id, done) => {
            setTodos(prev => prev.map(t => t.id === id ? { ...t, done: !done } : t));
          };

          return (
            <div className="min-h-screen text-white pb-24 font-sans bg-amber-950 p-4">

                </header>

                {/* Navigation Tabs */}

                </div>

                {activeTab === 'schedule' && (
